# Gate on every push and pull request; deploy to GitHub Pages from the default branch once it passes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline test gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npx playwright install --with-deps chromium

      - name: Tide data is well-formed and not expired
        # The 90-day early warning lives in the scheduled canary so it never blocks unrelated fixes.
        run: python tools/check_tide_data.py --warn-days 0

      - name: Page tests (network fully mocked)
        run: npx playwright test --project=gate --trace off

      - name: Calendar export passes independent iCalendar validation
        run: python tools/validate_ics.py test-results/exports

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  pages-build:
    name: Build site for GitHub Pages
    needs: test
    # Publish from the repository's default branch (GitHub's github-pages environment only accepts that branch).
    # Deploys start from a manual "Run workflow" or from the Auto-merge workflow after it merges a PR and syncs
    # the default branch with main — never from ordinary pushes, so unmerged work is never published.
    # Needs Settings → Pages → Source: GitHub Actions (once).
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions replace the workflow defaults, so read access to the repo must be listed too
    # (without it, checkout of a private repo fails with "Repository not found").
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site (only the files the page needs)
        run: mkdir _site && cp -r index.html tides-data.js manifest.webmanifest sw.js icons _site/
      # Pinned to the standard, proven trio; Dependabot skips their major updates (see .github/dependabot.yml).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    # A separate job, as in GitHub's own Pages template: deploying in the same job as the upload raced
    # ("No artifacts named github-pages were found" moments after a successful upload).
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read      # lets deploy-pages look up the uploaded site artifact
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Smoke-check the live site
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          for f in index.html tides-data.js manifest.webmanifest sw.js icons/apple-touch-icon.png; do
            for i in 1 2 3 4 5; do curl -fsS "$url$f" -o "/tmp/$(basename $f)" && break; sleep 10; done
          done
          grep -q "Weather Wahine" /tmp/index.html
          grep -q "LINZ_TIDES" /tmp/tides-data.js
          grep -q "standalone" /tmp/manifest.webmanifest
          echo "Live at $url"
