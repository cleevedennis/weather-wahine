version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
