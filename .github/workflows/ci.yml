# Gate on every push and pull request; deploy to GitHub Pages from the default branch once it passes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline test gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npx playwright install --with-deps chromium

      - name: Tide data is well-formed and not expired
        # The 90-day early warning lives in the scheduled canary so it never blocks unrelated fixes.
        run: python tools/check_tide_data.py --warn-days 0

      - name: Page tests (network fully mocked)
        run: npx playwright test --project=gate --trace off

      - name: Calendar export passes independent iCalendar validation
        run: python tools/validate_ics.py test-results/exports

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Only from the default branch, and only once the owner has switched Pages on (repo variable PAGES_ENABLED=true).
    # workflow_dispatch covers merges made by the Auto-merge workflow, which starts CI on the base branch afterwards.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only the files the page needs)
        run: mkdir _site && cp -r index.html tides-data.js manifest.webmanifest sw.js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Smoke-check the live site
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          for f in index.html tides-data.js manifest.webmanifest sw.js icons/apple-touch-icon.png; do
            for i in 1 2 3 4 5; do curl -fsS "$url$f" -o "/tmp/$(basename $f)" && break; sleep 10; done
          done
          grep -q "Weather Wahine" /tmp/index.html
          grep -q "LINZ_TIDES" /tmp/tides-data.js
          grep -q "standalone" /tmp/manifest.webmanifest
          echo "Live at $url"
